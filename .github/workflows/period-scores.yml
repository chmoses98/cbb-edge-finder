name: period-scores

# Official per-period (1H / 2H / regulation / overtime) scores for completed men's college
# basketball games, from ESPN's free public scoreboard/summary JSON. Used ONLY to verify Kalshi
# half-game and overtime settlements independently of Kalshi's own `result` (docs/MARKET_RESEARCH.md).
# Scheduled / dispatched runs append immutable JSONL partitions to the `period-scores-archive`
# branch; pull-request runs only validate the collector and upload an artifact (no branch writes).

on:
  schedule:
    - cron: "23 3,9,15 * 1-4,11,12 *"   # season (Nov-Apr): three sweeps a day
  workflow_dispatch:
  pull_request:
    paths:
      - "cbb_edge/market/period_scores.py"
      - ".github/workflows/period-scores.yml"

# Production runs stay serialized and are never cancelled; PR validation uses a per-PR group.
concurrency:
  group: period-scores${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Load existing archive (production only; PR runs start empty and never write)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir archive && cd archive
          git init -q
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin period-scores-archive; then
            git checkout -q -b period-scores-archive FETCH_HEAD
          else
            git checkout -q --orphan period-scores-archive
            printf '# Official per-period scores\n\nAppend-only JSONL partitions written by .github/workflows/period-scores.yml.\nLayout: periods/YYYY/MM/DD/<stamp>.jsonl. Schema: cbb_edge/market/period_scores.py (period-scores-v1).\n' > README.md
          fi
      - name: Collect last 3 days of completed games
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set -o pipefail
          out=archive
          if [ "${{ github.event_name }}" = "pull_request" ]; then out=period_pr_out; fi
          python -m cbb_edge.market.period_scores --out "$out" --days 3 | tee period_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period-scores-${{ github.run_id }}
          path: |
            archive/periods
            period_pr_out/periods
            period_summary.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Append partitions to period-scores-archive branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd archive
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to archive"
            exit 0
          fi
          git commit -q -m "period scores $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            git push -q origin period-scores-archive && exit 0
            sleep $((2 ** i))
            git fetch -q --depth=1 origin period-scores-archive && git rebase -q FETCH_HEAD || true
          done
          exit 1
