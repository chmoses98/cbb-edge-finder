name: official-roster-probe

# Wave 7 parser development: runs official roster discovery across the NCAA-derived
# domain registry once and commits gzipped evidence for the sites that did not parse
# (plus three examples per platform) to the roster-source-samples branch. Polite by
# construction (per-host 5 s spacing, robots.txt, <= 6 pages per site). Free sources
# only; the cost audit runs first.

on:
  workflow_dispatch:

env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: write  # roster-source-samples branch only

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Discover official rosters
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set -o pipefail
          python scripts/data/probe_official_rosters.py | tee probe_official.json
      - name: Commit evidence (append-only branch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d samples ] || exit 0
          mkdir arch && cd arch && git init -q
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin roster-source-samples; then git checkout -q -b s FETCH_HEAD; else git checkout -q --orphan s; fi
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p "$stamp" && cp -r ../samples/* "$stamp"/ && cp ../probe_official.json "$stamp"/ || true
          git add -A && git commit -q -m "official roster samples $stamp"
          git push -q origin HEAD:roster-source-samples
