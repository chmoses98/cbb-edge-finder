name: app-publish

# Sift Sports Intelligence publication (edge_finder.app.v1) for CBB.
#
# A TRANSLATION step, never a model run: cbb_edge/app/sift_app reads the archive branches
# (projections-archive, roster-archive, prospective-scores, schedule-archive, kalshi-archive)
# plus the free SDV schedule, and writes app/latest to the `app-data` branch. It never writes
# to an archive branch, never projects, never re-scores (tests/test_sift_app.py).
#
# `app-data` is REPLACED WHOLESALE on every publish (one orphan commit): it is a view, not an
# archive; the immutable evidence stays on the append-only archive branches. Nothing listens
# to pushes on `app-data`, so this workflow cannot loop. Re-running it with unchanged
# archives is safe (idempotent apart from the publication clock).

on:
  workflow_run:
    workflows: [prospective-projections, roster-capture, prospective-scores, ops-watch, kalshi-capture]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "35 */3 * * *"   # catch-up, year-round (preseason slate, roster refreshes)
  workflow_dispatch:
  pull_request:
    paths:
      - "cbb_edge/app/sift_app/**"
      - "contract/**"
      - ".github/workflows/app-publish.yml"

concurrency:
  group: app-publish
  cancel-in-progress: false

env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Vendored contract matches its manifest
        run: PYTHONPATH=contract python -m edge_finder_contract.sync --check
      - name: Fetch archive branches (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for b in projections-archive roster-archive prospective-scores schedule-archive kalshi-archive; do
            mkdir -p "arch/$b" && git -C "arch/$b" init -q
            git -C "arch/$b" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git -C "arch/$b" fetch -q --depth=1 origin "$b"; then git -C "arch/$b" checkout -q FETCH_HEAD; else echo "no $b yet"; fi
          done
      - name: Start from the last published tree (last-known-good on failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site && git -C site init -q
          git -C site remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C site fetch -q --depth=1 origin app-data && git -C site checkout -q FETCH_HEAD || echo "no app-data yet"
          rm -rf site/.git
      - name: Publish app/latest
        id: pub
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set +e
          python -m cbb_edge.app.sift_app --season 2027 \
            --projections arch/projections-archive --rosters arch/roster-archive \
            --scores arch/prospective-scores --schedule-archive arch/schedule-archive \
            --kalshi arch/kalshi-archive --out site/app/latest | tee publish.json
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          PYTHONPATH=contract python -m edge_finder_contract verify-explorer site/app/latest || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-app-${{ github.run_id }}
          path: |
            publish.json
            site/app/latest/health.json
            site/app/latest/manifest.json
          retention-days: 14
      - name: Replace app-data (one orphan commit; never an archive branch)
        if: github.event_name != 'pull_request' && hashFiles('site/app/latest/health.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site
          printf '# CBB app publication (edge_finder.app.v1)\n\nGenerated by .github/workflows/app-publish.yml from the archive branches; replaced on every publish. Read by Sift Sports Intelligence via the router registry. Not research evidence: the evidence is on the append-only archive branches.\n' > README.md
          git init -q -b app-data
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "app publication $(date -u +%Y-%m-%dT%H:%M:%SZ) (code ${GITHUB_SHA::12})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4; do
            git push -q -f origin app-data && exit 0
            sleep $((2 ** i))
          done
          exit 1
      - name: Fail when the publication failed (the last-known-good tree stays published)
        if: steps.pub.outputs.code != '0'
        run: exit 1
