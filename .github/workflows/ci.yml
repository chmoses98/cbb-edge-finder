name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Free-first: every paid / unknown-cost source is hard-disabled for all jobs.
env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cost audit (must pass before anything else)
        run: python -m cbb_edge.data.cost_policy audit
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (network disabled at socket level)
        run: pytest
      - name: Cost audit (post-test ledger)
        run: python -m cbb_edge.data.cost_policy audit
