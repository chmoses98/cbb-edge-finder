name: market-research

# Market-first CBB evaluation engine. Reads ONLY immutable archives (kalshi-archive raw captures,
# kalshi-panel-archive frozen as-of model joins, schedule-archive official scores) and rebuilds the
# derived research datasets: universe inventory, per-entry evaluations, family matrix, opening-night
# audit, health monitor and dashboard. Fully independent of the recommendation/app publisher.
# RESEARCH_ONLY: no orders, no authentication, no model or strategy changes.
on:
  workflow_run:
    workflows: [kalshi-market-panel]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "47 * * * *"  # catch skipped workflow_run triggers; settlement reconciliation
  workflow_dispatch:
  pull_request:
    paths:
      - "cbb_edge/kalshi/research/**"
      - ".github/workflows/market-research.yml"

concurrency:
  group: market-research${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: write
  actions: write  # only to re-dispatch a stale kalshi-capture (recovery step)

jobs:
  research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Fetch immutable input archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for b in kalshi-archive kalshi-panel-archive schedule-archive; do
            mkdir -p "arch/$b"
            git -C "arch/$b" init -q
            git -C "arch/$b" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -C "arch/$b" fetch -q --depth=1 origin "$b"
            git -C "arch/$b" checkout -q FETCH_HEAD
          done
      - name: Carry forward dated summaries
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research_out
          git -C research_out init -q
          git -C research_out remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C research_out fetch -q --depth=1 origin market-research; then
            git -C research_out checkout -q FETCH_HEAD -- daily 2>/dev/null || true
          fi
      - name: Fetch archived official fee schedule evidence (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p arch/fee-schedule-archive
          git -C arch/fee-schedule-archive init -q
          git -C arch/fee-schedule-archive remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C arch/fee-schedule-archive fetch -q --depth=1 origin fee-schedule-archive; then
            git -C arch/fee-schedule-archive checkout -q FETCH_HEAD
          else
            echo "no fee-schedule-archive yet: coefficients stay UNVERIFIED"
          fi
      - name: Collect recent workflow runs (pipeline monitor input)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --limit 300 --json workflowName,conclusion,status,event,createdAt > runs.json || echo '[]' > runs.json
      - name: Build market-wide datasets, matrix, audit and dashboard
        run: |
          set -o pipefail
          python -m cbb_edge.kalshi.research.run \
            --kalshi arch/kalshi-archive --panel arch/kalshi-panel-archive \
            --schedule arch/schedule-archive --runs runs.json \
            --fee-evidence arch/fee-schedule-archive/latest.json \
            --candidates research/candidates --out research_out | tee research_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-research-${{ github.run_id }}
          path: |
            research_summary.json
            research_out/latest/matrix.json
            research_out/latest/health.json
            research_out/latest/opening_night.*
            research_out/latest/dashboard.html
          retention-days: 14
      - name: Publish (latest replaced; dated summaries only ever added)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd research_out
          printf '# CBB market research (derived)\n\nRebuilt from immutable archives by .github/workflows/market-research.yml.\nSee docs/MARKET_RESEARCH.md. RESEARCH_ONLY.\n' > README.md
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one-commit history keeps the branch small; daily/ is carried forward unchanged
          git checkout -q --orphan publish
          git add -A
          git commit -q -m "market research $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            git push -q --force origin publish:market-research && exit 0
            sleep $((2 ** i))
          done
          exit 1
      - name: Recover stale capture (monitor -> dispatch)
        # GitHub drops most scheduled ticks under load (3 of ~60 expected on 2026-11-03). When the
        # monitor sees the newest snapshot older than its threshold, request one capture. The
        # capture workflow's serialized concurrency group prevents overlap; a gap already missed
        # stays a gap (never backfilled with invented quotes).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stale=$(python -c "import json;print(json.load(open('research_out/latest/health.json'))['findings']['latest_snapshot_stale'])")
          echo "latest_snapshot_stale=$stale"
          active=$(gh run list --workflow kalshi-capture.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length' || echo 0)
          echo "kalshi-capture runs already queued/in progress: $active"
          if [ "$stale" = "True" ] && [ "$active" = "0" ]; then
            gh workflow run kalshi-capture.yml --ref main
            echo "dispatched kalshi-capture"
          elif [ "$stale" = "True" ]; then
            echo "capture is stale but a run is already waiting for a runner; not stacking another"
          fi
