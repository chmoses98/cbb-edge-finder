name: free-source-probe

# Probes FREE public sources from GitHub's network (the development sandbox blocks
# several of them). A handful of cached requests; paid/unknown-cost sources are never
# called (cost audit + cost_policy gate).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sources (the free-source probes), official (Wave 7 official roster discovery across the domain registry) or gaps (Wave 8 targeted roster-gap evidence)"
        default: sources
  pull_request:
    paths:
      - "scripts/data/probe_sources.py"
      - "scripts/data/probe_availability.py"
      - "scripts/data/probe_rosters.py"
      - "scripts/data/probe_ncaa_directory.py"
      - ".github/workflows/source-probe.yml"

env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: write  # roster-source-samples branch only (raw samples for parser development)

jobs:
  probe:
    if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'official' && inputs.mode != 'gaps')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Probe
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          python scripts/data/probe_sources.py | tee probe.json
          python scripts/data/probe_availability.py | tee probe_availability.json
          python scripts/data/probe_rosters.py | tee probe_rosters.json
          python scripts/data/probe_ncaa_directory.py | tee probe_ncaa_directory.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-probe-${{ github.run_id }}
          path: |
            probe.json
            probe_availability.json
            probe_rosters.json
            probe_ncaa_directory.json
      - name: Commit raw roster-source samples (append-only branch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d samples ] || exit 0
          mkdir arch && cd arch && git init -q
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin roster-source-samples; then git checkout -q -b s FETCH_HEAD; else git checkout -q --orphan s; fi
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p "$stamp" && cp -r ../samples/* "$stamp"/
          git add -A && git commit -q -m "roster source samples $stamp"
          git push -q origin HEAD:roster-source-samples

  official:
    # Wave 7 parser development: official roster discovery across the NCAA-derived
    # domain registry, evidence for sites that did not parse (plus three examples per
    # platform) committed gzipped. Polite: per-host 5 s spacing, robots.txt, <= 6 pages
    # per site.
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'official' || inputs.mode == 'gaps')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Discover official rosters
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set -o pipefail
          if [ "${{ inputs.mode }}" = "gaps" ]; then
            python scripts/data/probe_roster_gaps.py | tee probe_official.json
          else
            python scripts/data/probe_official_rosters.py | tee probe_official.json
          fi
      - name: Commit evidence (append-only branch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d samples ] || exit 0
          cp probe_official.json samples/official/ 2>/dev/null || true
          mkdir arch && cd arch && git init -q
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin roster-source-samples; then git checkout -q -b s FETCH_HEAD; else git checkout -q --orphan s; fi
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p "$stamp" && cp -r ../samples/* "$stamp"/
          git add -A && git commit -q -m "official roster samples $stamp"
          git push -q origin HEAD:roster-source-samples
