name: roster-capture

# Immutable preseason / in-season roster snapshots (written when a roster changes; full weekly).
# Free ESPN public data only (cost-policy chokepoint, 1 req/s). Scheduled / dispatched
# runs append immutable snapshots to the `roster-archive` branch (only `state/` is
# rewritten: last seen status / roster hash used for change detection). Pull-request
# runs validate the capture against a temp dir and upload an artifact (no branch writes).

on:
  schedule:
    - cron: "17 11 * 9-11 *"          # Sep-Nov: daily change check
    - cron: "17 12 * 12,1-4 1"        # Dec-Apr: weekly (Mondays)
    # Wave 9 catch-up: hourly ticks that run only when the day's (Mondays' in Dec-Apr)
    # slot passed without a truth snapshot (cbb_edge/ops/cadence.py)
    - cron: "47 * * 9-11 *"
    - cron: "47 * * 12,1-4 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "cbb_edge/availability/**"
      - "cbb_edge/rosters/**"
      - ".github/workflows/roster-capture.yml"

concurrency:
  group: roster-capture
  cancel-in-progress: false

env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Fetch archive branch (state + history)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir archive && cd archive
          git init -q
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin roster-archive; then
            git checkout -q -b roster-archive FETCH_HEAD
          else
            git checkout -q --orphan roster-archive
            printf '# Roster snapshots (PURE input, PROSPECTIVE_ONLY)\n\nAppend-only; schema cbb_edge/availability/capture.py (roster-snapshot-v1).\n' > README.md
          fi
      - name: Decide (regular slot / catch-up / skip)
        id: decide
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -m cbb_edge.ops.cadence rosters --rosters archive | tee decide.json
      - name: Capture
        if: steps.decide.outputs.due == 'true'
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          if [ -d archive ]; then OUT=archive; LIMIT=""; else OUT=capture_out; LIMIT="--teams-limit 8"; fi
          python -m cbb_edge.availability.capture rosters --out "$OUT" --state "$OUT/state/roster_state.json" $( [ "$(date -u +%u)" = "1" ] && echo --full ) $LIMIT | tee capture_summary.json
      - name: NCAA Membership Directory refresh (weekly Sep-Nov, monthly otherwise)
        if: github.event_name != 'pull_request' && steps.decide.outputs.due == 'true'
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set -o pipefail
          disc=$(ls archive/official/*/*/*/*_discovery.json 2>/dev/null | sort | tail -1 || true)
          python -m cbb_edge.rosters.ncaa_directory --out archive --if-due ${disc:+--redirects "$disc"} | tee directory_summary.json
      - name: Roster truth (official rosters + multi-source resolution, Waves 6-7)
        if: github.event_name != 'pull_request' && steps.decide.outputs.due == 'true'
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set -o pipefail
          # the newest NCAA-derived registry (checksum-verified at import) or the committed one
          [ -f archive/ncaa_directory/latest_registry.json ] && export CBB_DOMAIN_REGISTRY="$PWD/archive/ncaa_directory/latest_registry.json"
          python -m cbb_edge.rosters.capture --archive archive | tee truth_summary.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: roster-capture-${{ github.run_id }}
          path: |
            capture_out
            capture_summary.json
          retention-days: 14
      - name: Append to roster-archive (never rewrite snapshots)
        if: github.event_name != 'pull_request' && steps.decide.outputs.due == 'true'
        run: |
          set -euo pipefail
          cd archive
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "rosters capture + truth $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            git push -q origin roster-archive && exit 0
            sleep $((2 ** i))
            git fetch -q --depth=1 origin roster-archive && git rebase -q FETCH_HEAD || true
          done
          exit 1
