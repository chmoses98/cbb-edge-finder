name: kalshi-capture

# Prospective, read-only capture of every Kalshi men's college basketball market.
# Kalshi public market data is free; GitHub Actions minutes are free for public repos.
# Scheduled/dispatched runs append immutable snapshots to the `kalshi-archive` branch.
# Price/size fields are public; full-depth orderbooks may require authentication and
# cannot be allowed to abort the otherwise complete anonymous market capture.
# Pull-request runs only validate the capture and upload an artifact (no branch writes).

on:
  schedule:
    # Four of the 48 intended half-hour ticks actually produced a snapshot on 2026-11-02.
    # Avoid GitHub's heavily loaded :00/:30 scheduler boundary and sample every 15m
    # during the season. With concurrency serialization there are no overlapping captures.
    - cron: "11,26,41,56 * * 1-4,11,12 *"  # season (Nov-Apr): staggered 15-minute cadence
    - cron: "23 */6 * 5-10 *"        # offseason: every 6 hours (futures markets)
  workflow_dispatch:
  # Run one real production capture as soon as this collector's workflow is changed on main.
  # This gives us a push-driven kickoff when GitHub scheduled cron ticks are delayed/dropped.
  push:
    branches: [main]
    paths:
      - ".github/workflows/kalshi-capture.yml"
  pull_request:
    paths:
      - "cbb_edge/kalshi/**"
      - ".github/workflows/kalshi-capture.yml"

# Production runs (schedule / push / workflow_run / dispatch) share ONE serialized group and are
# never cancelled. Pull-request validation runs get their own per-PR group so they cannot
# occupy or displace the single pending slot of the production group (which silently
# cancelled real captures), and superseded PR heads are cancelled instead of piling up.
concurrency:
  group: kalshi-capture${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ALLOW_PAID_ODDS_API: "false"
  ODDS_API_MAX_REQUESTS: "0"
  ALLOW_CBBD: "false"
  CBBD_MAX_REQUESTS: "0"

permissions:
  contents: write
  actions: write  # only to dispatch the next capture (self-chain step)

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # capture ~3 min + bounded wait before chaining the next run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Cost audit
        run: python -m cbb_edge.data.cost_policy audit
      - name: Capture full CBB board
        env:
          CBB_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set -o pipefail
          python -m cbb_edge.kalshi.capture --out kalshi_out \
            | tee capture_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalshi-snapshot-${{ github.run_id }}
          path: |
            kalshi_out
            capture_summary.json
          retention-days: 30
      - name: Append snapshot to kalshi-archive branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir archive && cd archive
          git init -q
          git config user.name "cbb-edge-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin kalshi-archive; then
            git checkout -q -b kalshi-archive FETCH_HEAD
          else
            git checkout -q --orphan kalshi-archive
            printf '# Kalshi CBB snapshot archive\n\nImmutable read-only snapshots written by .github/workflows/kalshi-capture.yml.\nSchema: cbb_edge/kalshi/capture.py (kalshi-snapshot-v1).\n' > README.md
          fi
          mkdir -p snapshots
          cp -r ../kalshi_out/* snapshots/
          git add -A
          git commit -q -m "kalshi snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            git push -q origin kalshi-archive && exit 0
            sleep $((2 ** i))
            git fetch -q --depth=1 origin kalshi-archive && git rebase -q FETCH_HEAD || true
          done
          exit 1
      - name: Chain the next capture (bounded; survives dropped schedule ticks)
        # GitHub drops most scheduled ticks under load (4% of expected in 24h on 2026-11-04) and
        # the research-side stale check only runs right after a capture, when the archive is fresh.
        # After a SUCCESSFUL production capture, wait, then request one more. Never chains from PR
        # runs or failed captures; skips when a capture is already queued/running (the serialized
        # concurrency group would only cancel the extra), so duplicate chains cannot multiply.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHAIN_WAIT_SECONDS: "720"
        run: |
          sleep "$CHAIN_WAIT_SECONDS"
          active=$(gh run list --workflow kalshi-capture.yml --limit 20 --json status,databaseId \
            --jq "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"pending\") and .databaseId != ${GITHUB_RUN_ID})] | length" || echo 0)
          echo "other kalshi-capture runs queued/in progress: $active"
          if [ "$active" = "0" ]; then
            gh workflow run kalshi-capture.yml --ref main
            echo "chained next kalshi-capture"
          else
            echo "another capture is already waiting; not chaining"
          fi
