[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbb-edge-finder"
version = "0.2.0"
description = "Free-first NCAA D-I men's basketball projection and research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-requests"]

[tool.setuptools.packages.find]
include = ["cbb_edge*"]

[tool.setuptools.package-data]
"cbb_edge.data.ids" = ["*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E501", "SIM102", "SIM108", "SIM401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
files = ["cbb_edge/data/cost_policy.py", "cbb_edge/data/http.py", "cbb_edge/kalshi", "cbb_edge/app/sift.py", "cbb_edge/market/odds_api.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["network: requires network (never run in CI)"]
